# electron-builder configuration — DR·QUIRO Reportes
appId: com.drquiro.reportes
productName: DR·QUIRO Reportes
executableName: DR-QUIRO-Reportes
copyright: "© 2026 DR·QUIRO"
directories:
  output: release
  buildResources: build
# Native modules ship prebuilt N-API binaries (sharp, onnxruntime-node): no rebuild.
npmRebuild: false
nodeGypRebuild: false
asar: true
# Native code must live outside the asar archive.
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/onnxruntime-node-darwin-x64/**"
  - "**/node_modules/onnxruntime-common/**"
files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{README,CHANGELOG,HISTORY}*"
  - "!**/node_modules/**/*.{md,ts,map}"
  - "!**/node_modules/onnxruntime-node*/bin/**/*{cuda,tensorrt}*"
# The background-removal model (downloaded with `npm run model`, never committed).
extraResources:
  - from: resources/models
    to: models
    filter: ["*.onnx"]
# Removes the ORT / sharp binaries of other platforms & architectures.
afterPack: scripts/after-pack.cjs

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Unsigned build (no certificate). See INSTALAR.md for the SmartScreen steps.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false            # per-user install, no admin rights needed
  allowElevation: false
  # Same folder as the previous install. A newer Setup upgrades in place and
  # keeps app data (the uninstaller is run with /KEEP_APP_DATA). Do not ask for
  # a new directory, or the user ends up with a second copy.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DR·QUIRO Reportes
  deleteAppDataOnUninstall: false
  # Spanish wizard. LCID 3082 is Spanish (Spain). installerLanguages limits the
  # MUI language to SpanishInternational. Do not set multiLanguageInstaller to
  # false: that path hardcodes en_US.
  language: "3082"
  installerLanguages:
    - es_ES
  artifactName: DR-QUIRO-Reportes-Setup-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.medical
  target:
    # Separate dmgs. A universal app cannot share one onnxruntime build:
    # 1.31 ships darwin-arm64 only; Intel uses the 1.23.2 alias package.
    - target: dmg
      arch: [arm64, x64]
  # No Apple Developer account: do not look up a Developer ID and do not notarize.
  # identity null skips electron-builder signing. afterPack then ad-hoc signs
  # (codesign --sign -) so Apple Silicon can launch the app. Hardened runtime
  # stays off: it would block the unpacked .node binaries without entitlements.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  # ASCII volume name. The middle dot in the product name breaks some hdiutil calls.
  title: DR-QUIRO Reportes ${version}
  icon: build/icon.png
  artifactName: DR-QUIRO-Reportes-${version}-${arch}.${ext}
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  icon: build/icon.png
  target: [dir]
  category: Graphics
