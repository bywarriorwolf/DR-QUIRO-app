# electron-builder configuration — DR·QUIRO Reportes
appId: com.drquiro.reportes.test
productName: DR·QUIRO Reportes TEST
executableName: DR-QUIRO-Reportes-TEST
copyright: Copyright © 2026 DR·QUIRO
directories:
  output: release
  buildResources: build
# Native modules ship prebuilt N-API binaries (sharp, onnxruntime-node): no rebuild.
npmRebuild: false
nodeGypRebuild: false
asar: true
# Native code must live outside the asar archive.
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/onnxruntime-node-darwin-x64/**"
  - "**/node_modules/onnxruntime-common/**"
files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{README,CHANGELOG,HISTORY}*"
  - "!**/node_modules/**/*.{md,ts,map}"
  - "!**/node_modules/onnxruntime-node*/bin/**/*{cuda,tensorrt}*"
# The background-removal model (downloaded with `npm run model`, never committed).
extraResources:
  - from: resources/models
    to: models
    filter: ["*.onnx"]
# Removes the ORT / sharp binaries of other platforms & architectures.
afterPack: scripts/after-pack.cjs

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Unsigned build (no certificate). See INSTALAR.md for the SmartScreen steps.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false            # per-user install, no admin rights needed
  allowElevation: false
  # Same folder as the previous install. A newer Setup upgrades in place and
  # keeps app data (the uninstaller is run with /KEEP_APP_DATA). Do not ask for
  # a new directory, or the user ends up with a second copy.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DR·QUIRO Reportes TEST
  deleteAppDataOnUninstall: false
  artifactName: DR-QUIRO-Reportes-TEST-1.1.0-test1-Setup.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.medical
  target:
    - target: dmg
      arch: [x64, arm64]
  # Not signed / notarized (no Apple Developer account). See INSTALAR.md.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: DR-QUIRO-Reportes-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  target: [dir]
  category: Graphics
