name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The real-model test is skipped here (no sample photos in the repo).
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: npm run dist:win
            files: |
              release/*.exe
          - os: macos-latest
            dist: npm run dist:mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: never try to find a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # macos-latest is Apple Silicon; the Intel dmg also needs sharp's x64 binaries.
      - name: sharp binaries for Intel Macs
        if: runner.os == 'macOS'
        run: npm install --no-save --force @img/sharp-darwin-x64@0.35.5 @img/sharp-libvips-darwin-x64@1.3.4

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: resources/models
          key: model-isnet-general-use-60920e99c454
      - name: Download background-removal model (verifies SHA-256)
        run: npm run model

      - name: Build installers
        run: ${{ matrix.dist }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft GitHub release with the installers
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
