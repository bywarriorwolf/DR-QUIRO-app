name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The real-model test is skipped here (no sample photos in the repo).
      - run: npm test

  build:
    needs: test
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: npm run dist:win
            files: release/*.exe
          # macos-latest is arm64 and, on this repo, is cancelled before it starts
          # ("not acquired by a hosted runner" / arm64 capacity). Intel runners
          # are a different pool. electron-builder still emits both dmgs there.
          - os: macos-15-intel
            dist: npm run dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: never try to find a Developer ID.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The runner is one architecture. Both dmgs need sharp's matching binaries,
      # and both onnxruntime trees (1.31 arm64, 1.23.2 Intel alias) must be on disk.
      - name: Mac native binaries for arm64 and x64
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          npm install --no-save --force \
            @img/sharp-darwin-arm64@0.35.5 \
            @img/sharp-libvips-darwin-arm64@1.3.4 \
            @img/sharp-darwin-x64@0.35.5 \
            @img/sharp-libvips-darwin-x64@1.3.4
          test -d node_modules/@img/sharp-darwin-arm64
          test -d node_modules/@img/sharp-libvips-darwin-arm64
          test -d node_modules/@img/sharp-darwin-x64
          test -d node_modules/@img/sharp-libvips-darwin-x64
          test -f node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64/onnxruntime_binding.node
          test -f node_modules/onnxruntime-node-darwin-x64/bin/napi-v6/darwin/x64/onnxruntime_binding.node

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: resources/models
          key: model-isnet-general-use-60920e99c454
      - name: Download background-removal model (verifies SHA-256)
        run: npm run model

      - name: Build installers
        run: ${{ matrix.dist }}

      - name: Check macOS disk images
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/DR-QUIRO-Reportes-*.dmg)
          test "${#dmgs[@]}" -eq 2
          for dmg in "${dmgs[@]}"; do
            echo "inspect $dmg"
            mnt=$(mktemp -d /tmp/drq-dmg.XXXX)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            cleanup() { hdiutil detach "$mnt" || hdiutil detach -force "$mnt" || true; rm -rf "$mnt"; }
            trap cleanup EXIT
            test -L "$mnt/Applications"
            test "$(readlink "$mnt/Applications")" = "/Applications"
            app=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$app"
            test -n "$(find "$app/Contents/Resources" -name '*.icns' -print -quit)"
            codesign -dv "$app" 2>&1 | tee /tmp/drq-codesign.txt
            grep -q 'Signature=adhoc' /tmp/drq-codesign.txt
            test -n "$(find "$app/Contents/Resources/models" -name '*.onnx' -print -quit)"
            unpacked="$app/Contents/Resources/app.asar.unpacked/node_modules"
            if [[ "$dmg" == *-x64.dmg ]]; then arch=x64; ort=onnxruntime-node-darwin-x64; else arch=arm64; ort=onnxruntime-node; fi
            test -f "$unpacked/$ort/bin/napi-v6/darwin/$arch/onnxruntime_binding.node"
            test -d "$unpacked/@img/sharp-darwin-$arch"
            test -d "$unpacked/@img/sharp-libvips-darwin-$arch"
            if [[ "$arch" == arm64 ]]; then
              test ! -d "$unpacked/@img/sharp-darwin-x64"
              test ! -d "$unpacked/onnxruntime-node-darwin-x64/bin/napi-v6/darwin/x64"
            else
              test ! -d "$unpacked/@img/sharp-darwin-arm64"
              test ! -d "$unpacked/onnxruntime-node/bin/napi-v6/darwin/arm64"
            fi
            test ! -d "$unpacked/@img/sharp-linux-x64"
            trap - EXIT
            cleanup
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Windows ZIP and separate macOS disk images
        run: |
          set -euo pipefail
          mkdir -p dist-release
          mapfile -t exes < <(find out -type f -name 'DR-QUIRO-Reportes-Setup-*.exe' | sort)
          mapfile -t dmgs < <(find out -type f -name 'DR-QUIRO-Reportes-*.dmg' | sort)
          if [ "${#exes[@]}" -ne 1 ]; then
            echo "expected exactly one Setup exe, found ${#exes[@]}"
            printf '%s\n' "${exes[@]:-}"
            exit 1
          fi
          if [ "${#dmgs[@]}" -ne 2 ]; then
            echo "expected exactly two dmg files, found ${#dmgs[@]}"
            printf '%s\n' "${dmgs[@]:-}"
            exit 1
          fi
          exe="${exes[0]}"
          base=$(basename "$exe")
          ver=$(printf '%s\n' "$base" | sed -n 's/^DR-QUIRO-Reportes-Setup-\(.*\)\.exe$/\1/p')
          test -n "$ver"
          zipfile="$GITHUB_WORKSPACE/dist-release/DR-QUIRO-Reportes-${ver}-Windows.zip"
          ( cd "$(dirname "$exe")" && zip -j -X "$zipfile" "$base" )
          listing=$(unzip -Z1 "$zipfile")
          test "$listing" = "$base"
          for d in "${dmgs[@]}"; do cp "$d" dist-release/; done
          stray=$(find dist-release -type f ! -name '*.zip' ! -name '*.dmg' -print)
          if [ -n "$stray" ]; then
            echo "stray release files:"
            printf '%s\n' "$stray"
            exit 1
          fi
          ls -lh dist-release
          {
            echo "# DR·QUIRO Reportes ${ver}"
            echo
            echo "El ZIP de Windows contiene solo \`DR-QUIRO-Reportes-Setup-${ver}.exe\`. Ciérrelo e instálelo encima de la versión anterior; no hace falta desinstalar."
            echo
            echo "Los discos de macOS van aparte (no están dentro del ZIP):"
            echo
            echo "- \`DR-QUIRO-Reportes-${ver}-arm64.dmg\` (Apple Silicon)"
            echo "- \`DR-QUIRO-Reportes-${ver}-x64.dmg\` (Intel)"
            echo
            echo "En esta versión, Reporte Comparativo deja desactivadas las cuatro lesiones (el texto se conserva si vuelve a Reporte Inicial, y no se envía a Canva). «Creando Documento» vuelve a mostrar el Yoda animado original. El botón verde **Nuevo reporte**, junto al nombre, limpia la pantalla sin desconectar Canva."
            echo
            cat INSTALAR-MAC.md
          } > /tmp/release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist-release/*
          fail_on_unmatched_files: true
          body_path: /tmp/release-notes.md
